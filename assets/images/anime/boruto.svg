<svg viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="boruto-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c2b6b"/>
      <stop offset="55%" stop-color="#3b3ea8"/>
      <stop offset="100%" stop-color="#e63b8f"/>
    </linearGradient>
    <radialGradient id="boruto-orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#dff3ff"/>
      <stop offset="60%" stop-color="#4fd9ff"/>
      <stop offset="100%" stop-color="#4fd9ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="600" fill="url(#boruto-bg)"/>
  <!-- energy vortex, abstract -->
  <g transform="translate(200,240)">
    <circle r="70" fill="url(#boruto-orb)"/>
    <g stroke="#dff3ff" stroke-width="3" fill="none" opacity="0.8">
      <path d="M-90,0 A90,90 0 0 1 0,-90"/>
      <path d="M90,10 A90,90 0 0 1 10,90"/>
      <path d="M-70,-60 A95,95 0 0 1 60,-75"/>
    </g>
  </g>
  <g fill="#dff3ff" opacity="0.6">
    <circle cx="90" cy="120" r="2"/>
    <circle cx="320" cy="150" r="2.5"/>
    <circle cx="330" cy="420" r="2"/>
    <circle cx="60" cy="400" r="1.8"/>
  </g>
  <text x="200" y="500" text-anchor="middle" font-family="Arial Black, sans-serif" font-weight="900"
    font-size="42" fill="#ffffff" letter-spacing="2">BORUTO</text>
  <text x="200" y="524" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#dff3ff"
    letter-spacing="3">NEXT GENERATIONS</text>
  <text x="200" y="552" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#dff3ff">
    ー ボルト ー</text>
</svg>
