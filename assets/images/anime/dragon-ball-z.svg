  </defs>
  <rect width="400" height="600" fill="url(#dbz-bg)"/>
  <!-- energy burst -->
  <g stroke="#ffdf8a" stroke-width="2" opacity="0.5">
    <line x1="200" y1="260" x2="200" y2="60"/>
    <line x1="200" y1="260" x2="360" y2="150"/>
    <line x1="200" y1="260" x2="40" y2="150"/>
    <line x1="200" y1="260" x2="330" y2="330"/>
    <line x1="200" y1="260" x2="70" y2="330"/>
