<svg viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="dbz-bg" cx="50%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#3a67c9"/>
      <stop offset="55%" stop-color="#152459"/>
      <stop offset="100%" stop-color="#05060f"/>
    </radialGradient>
    <radialGradient id="dbz-ball" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffe9a8"/>
      <stop offset="55%" stop-color="#ffb23d"/>
      <stop offset="100%" stop-color="#c0740f"/>
