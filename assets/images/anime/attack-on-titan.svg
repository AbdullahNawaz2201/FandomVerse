<svg viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="aot-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c98a4b"/>
      <stop offset="45%" stop-color="#5a4436"/>
      <stop offset="100%" stop-color="#100c09"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#aot-sky)"/>
  <!-- distant sun / haze -->
  <circle cx="200" cy="150" r="90" fill="#f2c48a" opacity="0.25"/>
  <!-- massive wall silhouette (abstract, not a character) -->
  <rect x="0" y="330" width="400" height="40" fill="#1a1410"/>
  <g fill="#1a1410">
    <rect x="0" y="300" width="60" height="30"/>
    <rect x="90" y="300" width="60" height="30"/>
    <rect x="180" y="300" width="60" height="30"/>
    <rect x="270" y="300" width="60" height="30"/>
    <rect x="360" y="300" width="40" height="30"/>
  </g>
  <!-- silhouette skyline / rubble -->
  <g fill="#0c0908">
    <polygon points="0,600 0,420 40,400 70,430 100,410 140,440 180,415 220,440 260,410 300,435 340,405 400,430 400,600"/>
  </g>
  <!-- smoke wisps -->
  <g fill="#2a2018" opacity="0.5">
    <ellipse cx="120" cy="380" rx="60" ry="90"/>
    <ellipse cx="300" cy="360" rx="70" ry="100"/>
  </g>
  <text x="200" y="500" text-anchor="middle" font-family="Georgia, serif" font-weight="700"
    font-size="34" fill="#f3ede4" letter-spacing="1">Attack on Titan</text>
  <text x="200" y="528" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#cbb89a">
    ー 進撃の巨人 ー</text>
</svg>
