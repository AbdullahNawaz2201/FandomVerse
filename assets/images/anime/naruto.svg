<svg viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="naruto-bg" cx="30%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#ff7a3d"/>
      <stop offset="45%" stop-color="#c9331f"/>
      <stop offset="100%" stop-color="#160805"/>
    </radialGradient>
    <linearGradient id="naruto-glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffcf6b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffcf6b" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#naruto-bg)"/>
  <!-- rising embers -->
  <g fill="#ffcf6b" opacity="0.75">
    <circle cx="70" cy="480" r="3"/>
    <circle cx="120" cy="420" r="2"/>
    <circle cx="310" cy="500" r="2.5"/>
    <circle cx="260" cy="440" r="2"/>
    <circle cx="340" cy="380" r="1.8"/>
    <circle cx="50" cy="350" r="1.6"/>
  </g>
  <!-- swirl motif (leaf spiral, abstract) -->
  <g transform="translate(200,230)" opacity="0.9">
    <path d="M0,-90 A90,90 0 0 1 78,45 A45,45 0 0 1 0,0 A45,45 0 0 1 -78,45 A90,90 0 0 1 0,-90 Z"
      fill="none" stroke="#160805" stroke-width="10"/>
    <circle r="14" fill="#160805"/>
  </g>
  <rect x="0" y="470" width="400" height="130" fill="url(#naruto-glow)" opacity="0.5"/>
  <text x="200" y="540" text-anchor="middle" font-family="Arial Black, sans-serif" font-weight="900"
    font-size="46" fill="#ffffff" letter-spacing="2">NARUTO</text>
  <text x="200" y="568" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#ffe3c2">
    ー ナルト ー</text>
</svg>
